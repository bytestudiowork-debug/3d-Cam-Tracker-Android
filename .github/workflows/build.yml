name: Android CI Build

run-name: Build optimized release APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform, build-tools, NDK + CMake
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "platforms;android-34"
            "build-tools;34.0.0"
            "ndk;27.0.12077973"
            "cmake;3.22.1"
          )

          # Retry interrupted downloads; clear incomplete SDK cache between attempts.
          for attempt in 1 2 3; do
            echo "Android SDK installation attempt ${attempt}/3"
            # sdkmanager can finish successfully before the yes process exits.
            # Ignore yes' expected SIGPIPE and use sdkmanager's exit status.
            set +o pipefail
            if yes | sdkmanager --install "${packages[@]}"; then
              set -o pipefail
              exit 0
            else
              install_status=$?
              set -o pipefail
            fi
            if [ "${attempt}" -lt 3 ]; then
              rm -rf "${ANDROID_SDK_ROOT}/.temp" "${HOME}/.android/cache"
              sleep $((attempt * 10))
            fi
          done
          echo "Android SDK installation failed after 3 attempts (sdkmanager exit: ${install_status})."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Install host Ceres for native numeric tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libceres-dev

      - name: Run native solver numeric tests
        run: |
          cmake -S app/src/main/cpp/native-tests -B build/native-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-tests --parallel 2
          ctest --test-dir build/native-tests --output-on-failure

      - name: Print native feature reference signature
        run: build/native-tests/camera_sift_reference_tests --dump

      - name: Run tracking engine unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace --no-daemon

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run engine instrumentation tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb logcat -c
            ./gradlew -PemulatorTestAbi=true connectedDebugAndroidTest --stacktrace --no-daemon
            adb logcat -d -s VideoReconstruction:I

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # PR builds still compile and run tests, but only branch/manual runs publish APK artifacts.
      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trackstudio-release-apk-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CMake/NDK logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            app/.cxx/**/*.log
            app/build/intermediates/cxx/**
          if-no-files-found: ignore
