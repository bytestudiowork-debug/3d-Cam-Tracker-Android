name: Android CI Build

run-name: Build optimized release APK

on:
  push:
    branches: ["main", "master", "global-reconstruction-engine", "feature/ai-engine"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        if: ${{ github.ref == 'refs/heads/feature/ai-engine' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements_mobile_feature_models.txt

      - name: Export and validate mobile inference assets
        if: ${{ github.ref == 'refs/heads/feature/ai-engine' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -r scripts/requirements_mobile_feature_models.txt
          python scripts/export_mobile_feature_models.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK platform, build-tools, NDK + CMake
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "platforms;android-34"
            "build-tools;34.0.0"
            "ndk;27.0.12077973"
            "cmake;3.22.1"
          )
          for attempt in 1 2 3; do
            echo "Android SDK installation attempt ${attempt}/3"
            set +o pipefail
            if yes | sdkmanager --install "${packages[@]}"; then
              set -o pipefail
              exit 0
            else
              install_status=$?
              set -o pipefail
            fi
            if [ "${attempt}" -lt 3 ]; then
              rm -rf "${ANDROID_SDK_ROOT}/.temp" "${HOME}/.android/cache"
              sleep $((attempt * 10))
            fi
          done
          echo "Android SDK installation failed after 3 attempts (sdkmanager exit: ${install_status})."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Run tracking engine unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace --no-daemon

      - name: Run on-device AI inference smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -wipe-data -memory 4096 -cores 2
          disable-animations: false
          script: |
            adb start-server
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell getprop ro.build.version.sdk
            adb devices -l
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trackstudio-release-apk-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CMake/NDK logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            app/.cxx/**/*.log
            app/build/intermediates/cxx/**
          if-no-files-found: ignore
