name: Android API 27 Compatibility

on:
  push:
    branches:
      - android-tracking-engine
  workflow_dispatch:

concurrency:
  group: android-api27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api27-instrumentation:
    name: Android 8.1 instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install compile SDK, NDK, and CMake
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation suite on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail; trap 'adb -s emulator-5554 logcat -d > api27-logcat.txt 2>/dev/null || true' EXIT; adb -s emulator-5554 wait-for-device; DEVICE_API="$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"; DEVICE_ABI="$(adb -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')"; BOOT_COMPLETED="$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')"; echo "Instrumentation device: API=$DEVICE_API ABI=$DEVICE_ABI boot=$BOOT_COMPLETED"; test "$DEVICE_API" = "27"; test "$DEVICE_ABI" = "x86"; test "$BOOT_COMPLETED" = "1"; adb -s emulator-5554 logcat -c; ./gradlew -PemulatorTestAbi=x86 -PincludeVideoTest=true connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android 8.1 device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api27-logcat
          path: api27-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
