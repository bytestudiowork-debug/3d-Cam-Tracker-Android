# Project-wide Gradle settings.
# Kept modest on purpose: this project is built on GitHub Actions' standard
# runners (7GB RAM), not a beefy workstation, so we avoid over-allocating.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Normal and release builds use phone ABIs; the emulator instrumentation
# invocation overrides this list without changing the release APK variant.
PROJECT_ABI_FILTERS=arm64-v8a,armeabi-v7a
